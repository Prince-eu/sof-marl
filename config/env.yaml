# SME treasury environment calibration.
# Each constant cites a public source or is tagged as an assumption to be
# sensitivity-tested (see docs/DATA.md and docs/EVALUATION.md). Values are reasonable
# defaults for ONE representative small-firm profile. Verify current public figures
# before the final run; anything tagged `assumption` must appear in the sensitivity
# analysis if it materially affects the conclusion.

horizon_weeks: 52

# --- SBA credit data source (Phase A) ---
sba:
  dataset_page: "https://data.sba.gov/en/dataset/7-a-504-foia"
  # 7(a) (FY2010-FY2019) resource, as of March 31, 2026 snapshot. Chosen to match
  # the DATA.md time-based split (train <=FY2017, test FY2018+) in a single file.
  csv_url: "https://data.sba.gov/sites/default/files/uploaded_resources/FOIA_7a_FY2010_FY2019_asof_260331.csv"
  raw_path: "data/raw/sba_7a.csv"
  processed_dir: "data/processed"
  # Time-based split (DATA.md 1.3): fit the model on the earliest cohort, calibrate
  # predicted probabilities on a later cohort never used for fitting, and evaluate on
  # the newest cohort, never touched until the final held-out metrics are computed.
  fit_fy_max: 2015 # approval fiscal years <= this go in the fit split
  calib_fy_max: 2017 # approval fiscal years in (fit_fy_max, calib_fy_max] go in calibration
  # approval fiscal years > calib_fy_max (i.e. 2018-2019) are the held-out test split

# --- initial balance sheet (USD) for the representative firm ---
# Firm value V = cash + reserve + invested + collectible_AR - term_debt - credit_drawn
initial:
  cash: 80000
  reserve: 20000
  invested: 0
  accounts_receivable: 90000        # distributed across aging buckets by ar_aging_init
  accounts_payable: 60000
  term_debt: 120000
  credit_drawn: 0
ar_aging_init: [0.6, 0.3, 0.1]      # fraction in [0-30, 31-60, 61-90] day buckets; assumption

# --- revenue / expenses ---
revenue:
  annual_mean: 1200000              # representative small-firm annual revenue; assumption
  weekly_sigma_frac: 0.15           # weekly volatility as fraction of weekly mean; assumption
  seasonal_amplitude: 0.20          # +/- 20% sinusoidal seasonal swing; assumption
expenses:
  fixed_weekly_frac: 0.55           # fixed share of expected weekly revenue; assumption
  discretionary_weekly_frac: 0.15   # deferrable share; assumption

# --- financing ---
credit_line:
  limit: 100000                     # revolving line capacity; assumption
  apr: 0.11                         # = bank prime loan rate (FRED MPRIME, 6.75% Jul 2026) + ~4.25pt small-business revolving spread (within SBA 7(a) allowable spread)
term_debt_apr: 0.09                 # = bank prime loan rate (FRED MPRIME, 6.75% Jul 2026) + ~2.25pt spread; secured, longer-dated term debt
late_payment_penalty_apr: 0.24

# --- liquidity target ---
buffer_days_target: 27              # JPMorgan Chase Institute, "Cash is King" (median buffer days)

# --- receivables / credit dynamics ---
collection_curve: [0.5, 0.35, 0.15] # fraction collected from each aging bucket per week; assumption
bad_debt_frac: 0.01                 # of receivables per period; assumption
credit_exposure_pool_size: 50       # exposures sampled per episode from held-out SBA records
exposure_resolution_weeks: 12       # weeks over which an accepted exposure repays or defaults
early_pay_discount_frac: 0.02       # discount given to accelerate AR collection (liquidity agent action); assumption

# --- capital allocation ---
investment_return:
  weekly_mean: 0.0015               # ~8% annualized; assumption
  weekly_sigma: 0.01

# --- accounts payable (Phase B) ---
# Rolling due-this-week / due-next-week horizon. A simplification of a full
# payment-terms ladder to weekly granularity: new fixed expenses are scheduled
# due one week out, giving the liquidity agent's defer_payables_frac action a
# real future slot to defer into (with late_payment_penalty_apr charged on
# whatever remains deferred). See docs/ARCHITECTURE.md section 3.
ap_schedule_weeks: 2

# --- credit exposure economics (Phase B; scores the real Phase-A SBA model) ---
# Real SBA loan amounts (gross_approval, median ~$100k in the held-out test split)
# are far larger than a single trade-credit exposure should be relative to this
# representative firm's ~$23k/week revenue. credit_exposure_scale_frac maps
# gross_approval down to a trade-credit-sized exposure; assumption, sensitivity-tested.
credit_exposure_scale_frac: 0.02
loss_given_default_frac: 0.6        # fraction of exposure notional lost on default; typical commercial LGD assumption
max_pending_credit_requests: 4      # cap on simultaneous pending exposures per week; overflow queues to next week

# --- expenditure agent latent operations-health term (Phase B) ---
# ARCHITECTURE.md section 4.3: over-deferral degrades a latent "operations health"
# term to prevent the trivial policy of never spending. Mean-reverts toward 1.0
# (healthy) when spend_now_frac is at or above the target rate, decays otherwise.
ops_health_target_spend_rate: 0.5   # assumption
ops_health_adjustment_rate: 0.1     # weekly mean-reversion speed; assumption
