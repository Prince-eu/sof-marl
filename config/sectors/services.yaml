# SECTOR PROFILE: SERVICES (docs/technical_report.md section 5.6).
# Professional-services SME: labor/salary-heavy fixed costs, low inventory/seasonality.
# Stylized sector profile derived from config/env.yaml; all deltas are
# economically-motivated ASSUMPTIONS (sector-typical, not from a single dated
# source), used for the cross-sector generalization experiment. Only economic
# constants vary across sectors; action/observation dimensions are unchanged.

