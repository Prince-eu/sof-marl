# PRE-REGISTERED STRESS SCENARIO E (docs/technical_report.md section 5.5).
# Derived from config/env.yaml; only the five fields below differ. The scenario was
# calibrated BLIND to the learned-policy ranking -- the harshness was set using only
# the fixed rule-based heuristic as a reference, tuned to the regime where solvency
# becomes a live constraint (rule-based breaches ~1 of 6 episodes) while the firm
# remains fundamentally survivable. Sourced/annotated comments for all unchanged
# constants live in config/env.yaml (this file is machine-generated, so they are
# not duplicated here).
#
# Deltas from baseline (config/env.yaml):
#   revenue.annual_mean        1_200_000 -> 840_000   (-30%: a sharp downturn)
#   revenue.weekly_sigma_frac  0.15      -> 0.50      (elevated cash-flow volatility)
#   expenses.fixed_weekly_frac 0.55      -> 0.72      (operating leverage: fixed costs
#                                                      a larger share of lower revenue)
#   initial.cash               80_000    -> 20_000    (thin starting buffer)
#   credit_line.limit          100_000   -> 15_000    (bank credit tightened in a downturn)
